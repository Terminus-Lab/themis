# LLM Judge Configuration for Themis
# Two-phase conversation evaluation:
#   Phase A (per-turn): scope: "turn"  — relevance, coherence, completeness
#   Phase B (holistic): scope: "conversation" — conversation-flow
#
# Scores: judges return integers 1–5, normalized to 0.0–1.0 internally.
#   1→0.00  2→0.25  3→0.50  4→0.75  5→1.00

judges:
  # Default model configuration applied to all judges unless overridden
  default_model:
    # modelFamily: "openai"  # Using Azure OpenAI
    modelFamily: "openai_platform"  # Using OpenAI Platform
    modelID: gpt-4o-mini
    # modelFamily: "ollama"
    # modelID: "qwen2.5:7b"
    max_tokens: 256
    temperature: 0.0
    retry: true

  evaluators:
    # Relevance Judge: Evaluates if the answer addresses the query
    - name: relevance
      enabled: true
      scope: turn
      weight: 0.5
      description: "Evaluates if the answer addresses the query"
      requires_context: false
      prompt: |
        You are an evaluation judge. Score how relevant the answer is to the query.

        Query: {{.Query}}
        Answer: {{.Answer}}

        Return an integer score from 1 to 5:
        5 - Perfect: fully addresses the query, no issues
        4 - Good: minor gaps or slight issues, usable
        3 - Acceptable: partially addresses query, needs review
        2 - Poor: significant problems, mostly unhelpful
        1 - Bad: wrong, empty, or completely off-topic

        Output ONLY valid JSON (no markdown, no explanation):
        {"score": <integer 1-5>, "reason": "<string>"}
      model:
        max_tokens: 200
        temperature: 0.0
        retry: true

    # Coherence Judge: Evaluates internal logical consistency
    - name: coherence
      enabled: false
      scope: turn
      weight: 0.30
      description: "Evaluates if the answer is internally logically consistent"
      requires_context: false
      prompt: |
        You are an evaluation judge.
        Score how logically coherent and internally consistent the answer is.
        Do NOT consider whether the answer is correct or relevant — only evaluate its internal logic.

        Answer: {{.Answer}}

        Return an integer score from 1 to 5:
        5 - Perfect: fully coherent, no contradictions
        4 - Good: minor inconsistencies, generally sound
        3 - Acceptable: some logical gaps but followable
        2 - Poor: significant internal contradictions
        1 - Bad: incoherent or self-contradictory throughout

        Respond ONLY in raw JSON with no markdown, no code blocks, no explanation:
        {"score": <integer 1-5>, "reason": "<string>"}
      model:
        max_tokens: 256
        temperature: 0.0
        retry: true

    # Completeness Judge: Evaluates if answer fully addresses all parts of query
    - name: completeness
      enabled: true
      scope: turn
      weight: 0.5
      description: "Evaluates whether the answer fully addresses all parts of the query"
      requires_context: false
      prompt: |
        You are a completeness judge. Evaluate whether the answer fully addresses all parts of the query.

        Query: {{.Query}}
        Answer: {{.Answer}}

        Identify all distinct questions or requests in the query, then score how completely the answer addresses them.

        Return an integer score from 1 to 5:
        5 - Perfect: every part fully addressed
        4 - Good: minor omissions, core parts covered
        3 - Acceptable: some parts missing or incomplete
        2 - Poor: major parts ignored or only superficially addressed
        1 - Bad: answer does not address the query at all

        Respond ONLY in raw JSON with no markdown, no code blocks, no explanation:
        {"score": <integer 1-5>, "reason": "<which parts were addressed>"}
      model:
        max_tokens: 256
        temperature: 0.0
        retry: true

    # Conversation Flow Judge: Holistic evaluation of the full conversation
    - name: conversation-flow
      enabled: true
      scope: conversation
      weight: 1.0
      description: "Evaluates coherence, context-awareness, and flow across all turns of a conversation"
      requires_context: false
      prompt: |
        You are a conversation quality evaluation judge.
        Evaluate the overall quality of this multi-turn agent conversation.

        Conversation turns:
        {{range .Turns}}Turn {{.TurnIndex}}:
        User: {{.UserQuery}}
        Agent: {{.Answer}}
        {{end}}

        Evaluate based on:
        - Flow: Does the conversation progress naturally turn-by-turn?
        - Context-awareness: Does the agent reference and build on prior turns?
        - Consistency: Are the agent's responses consistent with each other?
        - Engagement: Does the agent address the user's evolving needs?

        Return an integer score from 1 to 5:
        5 - Excellent: natural flow, highly context-aware, fully consistent
        4 - Good: minor issues, mostly coherent and context-aware
        3 - Acceptable: some context gaps or inconsistencies, needs review
        2 - Poor: frequently ignores prior turns or contradicts itself
        1 - Bad: no coherence, each turn treated as isolated

        Output ONLY valid JSON (no markdown, no explanation):
        {"score": <integer 1-5>, "reason": "<string>"}
      model:
        max_tokens: 300
        temperature: 0.0
        retry: true
