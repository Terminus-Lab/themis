<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Themis - Evaluation Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><style>circle,line{stroke:%23ececec;stroke-width:1.75;stroke-linecap:round}@media(prefers-color-scheme:light){circle,line{stroke:%230d0d0d}}</style><circle cx='12' cy='12' r='10'/><line x1='7' y1='9' x2='17' y2='9'/><line x1='12' y1='9' x2='12' y2='17'/></svg>">
    <style>
        :root {
            --sidebar-bg: #171717;
            --sidebar-hover: #212121;
            --sidebar-active: #2a2a2a;
            --main-bg: #212121;
            --surface: #2f2f2f;
            --surface-hover: #383838;
            --border: #383838;
            --text-primary: #ececec;
            --text-secondary: #8e8ea0;
            --text-muted: #6e6e80;
            --accent: #10a37f;
            --accent-hover: #1ab893;
            --accent-active: #0d8f6e;
            --input-bg: #2f2f2f;
            --input-border: #4a4a4a;
            --verdict-pass-bg: #10a37f22;
            --verdict-pass-fg: #10a37f;
            --verdict-review-bg: #f5a62322;
            --verdict-review-fg: #f5a623;
            --verdict-fail-bg: #ef444422;
            --verdict-fail-fg: #ef4444;
        }

        [data-theme="light"] {
            --sidebar-bg: #f0f0f0;
            --sidebar-hover: #e4e4e4;
            --sidebar-active: #d9d9d9;
            --main-bg: #ffffff;
            --surface: #f9f9f9;
            --surface-hover: #f0f0f0;
            --border: #e5e5e5;
            --text-primary: #0d0d0d;
            --text-secondary: #6e6e80;
            --text-muted: #8e8ea0;
            --accent: #10a37f;
            --accent-hover: #0d8f6e;
            --accent-active: #0a7a5e;
            --input-bg: #ffffff;
            --input-border: #d9d9d9;
            --verdict-pass-bg: #10a37f18;
            --verdict-pass-fg: #0d8f6e;
            --verdict-review-bg: #f5a62318;
            --verdict-review-fg: #c47d00;
            --verdict-fail-bg: #ef444418;
            --verdict-fail-fg: #dc2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--main-bg);
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 14px;
            height: 100vh;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
        }

        /* ── App shell ── */
        .app-shell {
            display: flex;
            height: 100vh;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: background 0.2s;
        }

        .sidebar-brand {
            padding: 20px 16px 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-brand-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .sidebar-brand-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 8px;
            overflow-y: auto;
        }

        .sidebar-section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 8px 8px 4px;
            margin-bottom: 2px;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: transparent;
            border: none;
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-secondary);
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s, color 0.15s;
            margin-bottom: 2px;
        }

        .tab:hover {
            background: var(--sidebar-hover);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--sidebar-active);
            color: var(--text-primary);
        }

        .tab-icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            opacity: 0.7;
        }

        .tab.active .tab-icon,
        .tab:hover .tab-icon {
            opacity: 1;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
        }

        .theme-toggle:hover {
            background: var(--sidebar-hover);
            color: var(--text-primary);
        }

        .theme-toggle-label {
            flex: 1;
            text-align: left;
        }

        /* ── Main content ── */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            padding: 16px 28px;
            border-bottom: 1px solid var(--border);
            background: var(--main-bg);
            display: flex;
            align-items: center;
            gap: 16px;
            min-height: 60px;
            transition: background 0.2s;
        }

        .top-bar-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }

        .top-bar-sub {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        /* ── Tab content panes ── */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ── Stats row ── */
        .stats {
            display: flex;
            gap: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            flex: 1;
            min-width: 130px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .stat-value {
            color: var(--accent);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* ── Verdict badges ── */
        .verdict {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .verdict-pass {
            background: var(--verdict-pass-bg);
            color: var(--verdict-pass-fg);
        }

        .verdict-review {
            background: var(--verdict-review-bg);
            color: var(--verdict-review-fg);
        }

        .verdict-fail {
            background: var(--verdict-fail-bg);
            color: var(--verdict-fail-fg);
        }

        .confidence {
            color: var(--accent);
            font-weight: 600;
        }

        /* ── Utility ── */
        .loading {
            text-align: center;
            padding: 48px;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 14px;
            opacity: 0.4;
        }

        .error {
            background: var(--verdict-fail-bg);
            border: 1px solid var(--verdict-fail-fg);
            border-radius: 10px;
            padding: 14px 16px;
            color: var(--verdict-fail-fg);
            margin-bottom: 18px;
            font-size: 14px;
        }

        .timestamp {
            color: var(--text-muted);
            font-size: 12px;
        }

        /* ── Refresh controls ── */
        .refresh-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 18px;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .refresh-status {
            flex: 1;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .refresh-status.active {
            color: var(--accent);
        }

        .refresh-controls button {
            padding: 7px 14px;
            font-size: 13px;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            background: var(--accent-active);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
        }

        /* ── Toggle switch ── */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
            margin: 0 8px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--border);
            border-radius: 22px;
            transition: 0.25s;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background: var(--main-bg);
            border-radius: 50%;
            transition: 0.25s;
        }

        input:checked + .toggle-slider {
            background: var(--accent);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(22px);
        }

        /* ── Conversations list ── */
        .conversation-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .conversation-card:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
        }

        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .conversation-id {
            color: var(--accent);
            font-size: 14px;
            font-weight: 600;
        }

        .conversation-turns {
            color: var(--text-secondary);
            font-size: 12px;
            background: var(--surface-hover);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .conversation-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .conversation-meta-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .conversation-meta-label {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .conversation-meta-value {
            color: var(--text-primary);
            font-size: 13px;
        }

        /* ── Turn items in detail view ── */
        .turn-item {
            background: var(--main-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .turn-item:hover {
            background: var(--surface);
            border-color: var(--accent);
        }

        .turn-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .turn-query {
            color: var(--text-primary);
            margin-bottom: 6px;
            font-size: 14px;
        }

        .turn-answer {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
        }

        .turn-footer {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
        }

        .back-button {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
        }

        .back-button:hover {
            background: var(--surface-hover);
        }

        /* ── Judge scores grid ── */
        .judge-scores {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            display: none;
        }

        .judge-scores.visible {
            display: block;
        }

        .stages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .stage-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
        }

        .stage-name {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
            text-transform: capitalize;
        }

        .stage-score {
            color: var(--accent);
            font-size: 20px;
            font-weight: 700;
        }

        .stage-reason {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 6px;
            line-height: 1.5;
        }

        /* ── Detail summary card ── */
        .detail-summary {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 20px;
        }

        .detail-summary-row {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .detail-summary-row:last-child {
            margin-bottom: 0;
        }

        .detail-metric {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .detail-metric-label {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .detail-metric-value {
            color: var(--accent);
            font-size: 18px;
            font-weight: 700;
        }

        .holistic-reason {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.7;
            padding: 10px 14px;
            background: var(--main-bg);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
            margin-top: 12px;
        }

        /* ── Monitoring ── */
        .monitoring-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 18px;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .monitoring-controls label {
            display: inline;
            margin: 0;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .monitoring-controls select {
            width: auto;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .metric-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .metric-section-title {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="app-shell">

    <!-- ── Sidebar ── -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-name">Themis</div>
            <div class="sidebar-brand-sub">Conversation Evaluation</div>
        </div>

        <nav class="sidebar-nav">
            <div class="sidebar-section-label">Views</div>
            <button class="tab active" id="conversationsTabBtn" onclick="showTab('conversations')">
                <span class="tab-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </span>
                Conversations
            </button>
            <button class="tab" id="monitoringTabBtn" onclick="showTab('monitoring')">
                <span class="tab-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                </span>
                Monitoring
            </button>
        </nav>

        <div class="sidebar-footer">
            <button class="theme-toggle" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span>
                <span class="theme-toggle-label" id="themeLabel">Dark mode</span>
            </button>
        </div>
    </div>

    <!-- ── Main content ── -->
    <div class="main-content">
        <div class="top-bar">
            <div class="top-bar-title" id="topBarTitle">Conversations</div>
            <div class="top-bar-sub" id="topBarSub"></div>
        </div>

        <div class="content-area">

            <!-- ── Conversations tab ── -->
            <div class="tab-content active" id="conversationsTab">

                <!-- List view -->
                <div id="conversationsListView">
                    <!-- Stats -->
                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-label">Total Conversations</div>
                            <div class="stat-value" id="totalConversations">—</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Avg Final Score</div>
                            <div class="stat-value" id="avgFinalScore">—</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Pass Rate</div>
                            <div class="stat-value" id="passRate">—</div>
                        </div>
                    </div>

                    <!-- Refresh controls -->
                    <div class="refresh-controls">
                        <span class="refresh-status" id="convRefreshStatus">Ready</span>
                        <button class="btn-secondary" onclick="fetchConversations()">Refresh</button>
                        <label style="display:flex;align-items:center;gap:4px;color:var(--text-secondary);font-size:13px;cursor:pointer;">
                            <span class="toggle-switch">
                                <input type="checkbox" id="autoRefreshToggle" onchange="toggleAutoRefresh()">
                                <span class="toggle-slider"></span>
                            </span>
                            Auto-refresh
                        </label>
                    </div>

                    <!-- Error -->
                    <div id="conversationErrorContainer"></div>

                    <!-- Conversation cards -->
                    <div id="conversationsList">
                        <div class="empty-state">
                            <div class="empty-state-icon">📡</div>
                            <div>Loading conversations...</div>
                        </div>
                    </div>
                </div>

                <!-- Detail view (hidden by default) -->
                <div id="conversationDetailView" style="display:none;">
                    <button class="back-button" onclick="backToConversationsList()">
                        ← Back to conversations
                    </button>
                    <div id="conversationDetail"></div>
                </div>

            </div>

            <!-- ── Monitoring tab ── -->
            <div class="tab-content" id="monitoringTab">
                <div class="monitoring-controls">
                    <label for="monitoringWindow">Window:</label>
                    <select id="monitoringWindow" onchange="fetchHealthMetrics()">
                        <option value="1d">Last 1 day</option>
                        <option value="7d" selected>Last 7 days</option>
                        <option value="30d">Last 30 days</option>
                    </select>
                    <button class="btn-secondary" onclick="fetchHealthMetrics()" style="margin-left:auto;">Refresh</button>
                </div>
                <div id="monitoringError"></div>
                <div id="monitoringContent">
                    <div class="empty-state">
                        <div class="empty-state-icon">📡</div>
                        <div>Loading metrics...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const API_BASE = window.location.origin;

    // ── Auto-refresh state ──
    let autoRefreshEnabled = false;
    let refreshInterval = null;

    // ── Conversations state ──
    let conversationsData = [];
    let currentConversationId = null;
    let conversationsLoaded = false;
    let monitoringLoaded = false;

    // ── Turn expansion state ──
    const expandedTurns = new Set();

    // ── Theme ──
    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeUI(next);
    }

    function updateThemeUI(theme) {
        document.getElementById('themeLabel').textContent = theme === 'light' ? 'Light mode' : 'Dark mode';
        document.getElementById('themeIcon').textContent = theme === 'light' ? '☀️' : '🌙';
    }

    function initializeTheme() {
        const saved = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        updateThemeUI(saved);
    }

    // ── Tab management ──
    function showTab(tabName) {
        window.location.hash = tabName;

        document.getElementById('conversationsTabBtn').classList.remove('active');
        document.getElementById('monitoringTabBtn').classList.remove('active');
        document.getElementById('conversationsTab').classList.remove('active');
        document.getElementById('monitoringTab').classList.remove('active');

        if (tabName === 'conversations') {
            document.getElementById('conversationsTabBtn').classList.add('active');
            document.getElementById('conversationsTab').classList.add('active');
            document.getElementById('topBarTitle').textContent = 'Conversations';
            if (!conversationsLoaded) fetchConversations();
        } else if (tabName === 'monitoring') {
            document.getElementById('monitoringTabBtn').classList.add('active');
            document.getElementById('monitoringTab').classList.add('active');
            document.getElementById('topBarTitle').textContent = 'Monitoring';
            if (!monitoringLoaded) fetchHealthMetrics();
        }
    }

    function initializeTab() {
        const hash = window.location.hash.substring(1);
        if (hash.startsWith('conversations/')) {
            const convId = hash.substring('conversations/'.length);
            showTab('conversations');
            fetchConversations().then(() => viewConversationDetails(convId, false));
        } else if (hash === 'monitoring') {
            showTab('monitoring');
        } else {
            showTab('conversations');
        }
    }

    window.addEventListener('hashchange', function () {
        const hash = window.location.hash.substring(1);
        document.getElementById('conversationsTabBtn').classList.remove('active');
        document.getElementById('monitoringTabBtn').classList.remove('active');
        document.getElementById('conversationsTab').classList.remove('active');
        document.getElementById('monitoringTab').classList.remove('active');

        if (hash.startsWith('conversations/')) {
            const convId = hash.substring('conversations/'.length);
            document.getElementById('conversationsTabBtn').classList.add('active');
            document.getElementById('conversationsTab').classList.add('active');
            document.getElementById('topBarTitle').textContent = 'Conversations';
            if (!conversationsLoaded) {
                fetchConversations().then(() => viewConversationDetails(convId, false));
            } else {
                viewConversationDetails(convId, false);
            }
        } else if (hash === 'conversations') {
            document.getElementById('conversationsTabBtn').classList.add('active');
            document.getElementById('conversationsTab').classList.add('active');
            document.getElementById('topBarTitle').textContent = 'Conversations';
            if (currentConversationId) {
                document.getElementById('conversationsListView').style.display = 'block';
                document.getElementById('conversationDetailView').style.display = 'none';
                currentConversationId = null;
            }
            if (!conversationsLoaded) fetchConversations();
        } else if (hash === 'monitoring') {
            document.getElementById('monitoringTabBtn').classList.add('active');
            document.getElementById('monitoringTab').classList.add('active');
            document.getElementById('topBarTitle').textContent = 'Monitoring';
            if (!monitoringLoaded) fetchHealthMetrics();
        } else {
            showTab('conversations');
        }
    });

    // ── Conversations ──
    async function fetchConversations() {
        const url = `${API_BASE}/api/v1/conversations`;
        document.getElementById('convRefreshStatus').textContent = '🔄 Loading...';
        document.getElementById('conversationErrorContainer').innerHTML = '';

        try {
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
            const data = await resp.json();
            conversationsData = data.conversations || [];
            renderConversations(conversationsData);
            updateConversationStats(conversationsData);
            conversationsLoaded = true;
            const count = conversationsData.length;
            document.getElementById('convRefreshStatus').textContent =
                `Loaded ${count} conversation${count !== 1 ? 's' : ''}`;
        } catch (err) {
            document.getElementById('conversationErrorContainer').innerHTML =
                `<div class="error">Failed to fetch conversations: ${err.message}</div>`;
            document.getElementById('convRefreshStatus').textContent = 'Failed to load';
        }
    }

    function renderConversations(conversations) {
        const container = document.getElementById('conversationsList');

        if (!conversations || conversations.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div>No conversations yet</div>
                    <div style="margin-top:10px;font-size:12px;">
                        Evaluate conversations via the API or CLI to see results here
                    </div>
                </div>`;
            return;
        }

        container.innerHTML = '';
        conversations.forEach(conv => {
            const card = document.createElement('div');
            card.className = 'conversation-card';
            card.onclick = () => viewConversationDetails(conv.conversation_id);

            const score = typeof conv.final_score === 'number'
                ? (conv.final_score * 100).toFixed(1) + '%'
                : '—';
            const createdAt = conv.created_at
                ? new Date(conv.created_at).toLocaleString()
                : '—';
            const agentLabel = conv.agent_version
                ? `${conv.agent_name} v${conv.agent_version}`
                : conv.agent_name || '—';

            card.innerHTML = `
                <div class="conversation-header">
                    <div class="conversation-id">${escapeHtml(conv.conversation_id)}</div>
                    <span class="verdict verdict-${conv.verdict || 'review'}">${conv.verdict || '—'}</span>
                </div>
                <div class="conversation-meta">
                    <div class="conversation-meta-item">
                        <div class="conversation-meta-label">Agent</div>
                        <div class="conversation-meta-value">${escapeHtml(agentLabel)}</div>
                    </div>
                    <div class="conversation-meta-item">
                        <div class="conversation-meta-label">Turns</div>
                        <div class="conversation-meta-value">${conv.turn_count || 0}</div>
                    </div>
                    <div class="conversation-meta-item">
                        <div class="conversation-meta-label">Final Score</div>
                        <div class="conversation-meta-value confidence">${score}</div>
                    </div>
                    <div class="conversation-meta-item">
                        <div class="conversation-meta-label">Evaluated</div>
                        <div class="conversation-meta-value timestamp">${createdAt}</div>
                    </div>
                </div>`;
            container.appendChild(card);
        });
    }

    function updateConversationStats(conversations) {
        if (!conversations || conversations.length === 0) {
            document.getElementById('totalConversations').textContent = '0';
            document.getElementById('avgFinalScore').textContent = '—';
            document.getElementById('passRate').textContent = '—';
            return;
        }

        const total = conversations.length;
        const scores = conversations.map(c => c.final_score || 0);
        const avg = scores.reduce((a, b) => a + b, 0) / total;
        const passCount = conversations.filter(c => c.verdict === 'pass').length;

        document.getElementById('totalConversations').textContent = total;
        document.getElementById('avgFinalScore').textContent = (avg * 100).toFixed(1) + '%';
        document.getElementById('passRate').textContent = ((passCount / total) * 100).toFixed(0) + '%';
    }

    async function viewConversationDetails(conversationId, updateHash = true) {
        currentConversationId = conversationId;
        if (updateHash) window.location.hash = `conversations/${conversationId}`;

        document.getElementById('conversationDetail').innerHTML =
            `<div class="loading">Loading conversation...</div>`;
        document.getElementById('conversationsListView').style.display = 'none';
        document.getElementById('conversationDetailView').style.display = 'block';
        expandedTurns.clear();

        try {
            const resp = await fetch(`${API_BASE}/api/v1/conversations/${conversationId}`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
            const data = await resp.json();
            renderConversationDetail(data);
        } catch (err) {
            document.getElementById('conversationDetail').innerHTML =
                `<div class="error">Failed to load conversation: ${err.message}</div>`;
        }
    }

    function renderConversationDetail(data) {
        const container = document.getElementById('conversationDetail');
        const turns = data.turn_results || [];

        const agentLabel = data.agent_version
            ? `${data.agent_name} v${data.agent_version}`
            : data.agent_name || '—';
        const finalScore = typeof data.final_score === 'number'
            ? (data.final_score * 100).toFixed(1) + '%' : '—';
        const turnAvg = typeof data.turn_avg === 'number'
            ? (data.turn_avg * 100).toFixed(1) + '%' : '—';
        const holisticScore = typeof data.holistic_score === 'number'
            ? (data.holistic_score * 100).toFixed(1) + '%' : '—';

        let html = `
            <div class="detail-summary">
                <div class="detail-summary-row">
                    <div class="detail-metric">
                        <div class="detail-metric-label">Conversation</div>
                        <div style="color:var(--accent);font-size:15px;font-weight:600;">${escapeHtml(data.conversation_id)}</div>
                    </div>
                    <div class="detail-metric">
                        <div class="detail-metric-label">Agent</div>
                        <div style="color:var(--text-primary);font-size:14px;">${escapeHtml(agentLabel)}</div>
                    </div>
                    <div style="margin-left:auto;">
                        <span class="verdict verdict-${data.verdict || 'review'}" style="font-size:13px;padding:4px 14px;">${data.verdict || '—'}</span>
                    </div>
                </div>
                <div class="detail-summary-row">
                    <div class="detail-metric">
                        <div class="detail-metric-label">Final Score</div>
                        <div class="detail-metric-value">${finalScore}</div>
                    </div>
                    <div class="detail-metric">
                        <div class="detail-metric-label">Turn Avg</div>
                        <div class="detail-metric-value">${turnAvg}</div>
                    </div>
                    <div class="detail-metric">
                        <div class="detail-metric-label">Holistic</div>
                        <div class="detail-metric-value">${holisticScore}</div>
                    </div>
                    <div class="detail-metric">
                        <div class="detail-metric-label">Turns</div>
                        <div class="detail-metric-value">${data.turn_count || turns.length}</div>
                    </div>
                </div>
                ${data.holistic_reason ? `
                <div class="holistic-reason">
                    <strong style="color:var(--text-secondary);font-size:11px;text-transform:uppercase;letter-spacing:0.4px;">Holistic Assessment</strong><br>
                    ${escapeHtml(data.holistic_reason)}
                </div>` : ''}
            </div>

            <h3 style="color:var(--text-secondary);margin-bottom:14px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">
                Turns (${turns.length})
            </h3>`;

        if (turns.length === 0) {
            html += `<div class="empty-state">No turn data available</div>`;
        } else {
            turns.forEach((turn, idx) => {
                const turnId = `turn-${idx}`;
                const turnScore = typeof turn.turn_score === 'number'
                    ? (turn.turn_score * 100).toFixed(1) + '%' : '—';
                const judgeScoresHtml = buildJudgeScoresHtml(turn.scores || []);

                html += `
                    <div class="turn-item" onclick="toggleTurn('${turnId}')">
                        <div class="turn-header">
                            <div style="color:var(--accent);font-weight:600;font-size:13px;">
                                Turn ${turn.turn_index || idx + 1}
                            </div>
                            <div style="display:flex;gap:10px;align-items:center;">
                                <span class="confidence">${turnScore}</span>
                            </div>
                        </div>
                        <div class="turn-query"><strong>Query:</strong> ${escapeHtml(turn.user_query || '')}</div>
                        <div class="turn-answer"><strong>Answer:</strong> ${escapeHtml(turn.answer || '')}</div>
                        <div class="turn-footer">
                            <span>${(turn.scores || []).length} judges · Click to ${expandedTurns.has(turnId) ? 'hide' : 'show'} scores</span>
                        </div>
                        <div class="judge-scores${expandedTurns.has(turnId) ? ' visible' : ''}" id="${turnId}-scores">
                            ${judgeScoresHtml}
                        </div>
                    </div>`;
            });
        }

        container.innerHTML = html;
    }

    function buildJudgeScoresHtml(scores) {
        if (!scores || scores.length === 0) return '<div style="color:var(--text-muted);font-size:13px;">No judge scores available</div>';
        return `<div class="stages-grid">` + scores.map(s => `
            <div class="stage-card">
                <div class="stage-name">${escapeHtml(s.name || '')}</div>
                <div class="stage-score">${typeof s.score === 'number' ? (s.score * 100).toFixed(1) + '%' : '—'}</div>
                ${s.reason ? `<div class="stage-reason">${escapeHtml(s.reason)}</div>` : ''}
            </div>`).join('') + `</div>`;
    }

    function toggleTurn(turnId) {
        const scoresEl = document.getElementById(`${turnId}-scores`);
        if (!scoresEl) return;

        if (expandedTurns.has(turnId)) {
            expandedTurns.delete(turnId);
            scoresEl.classList.remove('visible');
        } else {
            expandedTurns.add(turnId);
            scoresEl.classList.add('visible');
        }

        // Update footer hint text
        const item = scoresEl.closest('.turn-item');
        if (item) {
            const footer = item.querySelector('.turn-footer span');
            if (footer) {
                const scoreCount = (scoresEl.querySelectorAll('.stage-card') || []).length;
                footer.textContent = `${scoreCount} judges · Click to ${expandedTurns.has(turnId) ? 'hide' : 'show'} scores`;
            }
        }
    }

    function backToConversationsList() {
        currentConversationId = null;
        window.location.hash = 'conversations';
        document.getElementById('conversationsListView').style.display = 'block';
        document.getElementById('conversationDetailView').style.display = 'none';
    }

    // ── Auto-refresh ──
    function toggleAutoRefresh() {
        autoRefreshEnabled = document.getElementById('autoRefreshToggle').checked;
        localStorage.setItem('autoRefreshEnabled', autoRefreshEnabled);
        if (autoRefreshEnabled) {
            startAutoRefresh();
        } else {
            stopAutoRefresh();
        }
    }

    function startAutoRefresh() {
        autoRefreshEnabled = true;
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            // Only refresh the list view (not while viewing details)
            if (!currentConversationId) fetchConversations();
        }, 10000);
        document.getElementById('convRefreshStatus').classList.add('active');
    }

    function stopAutoRefresh() {
        autoRefreshEnabled = false;
        if (refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
        }
        document.getElementById('convRefreshStatus').classList.remove('active');
    }

    // ── Monitoring ──
    async function fetchHealthMetrics() {
        const windowVal = document.getElementById('monitoringWindow').value;
        const url = `${API_BASE}/api/v1/metrics/health?window=${windowVal}`;
        monitoringLoaded = true;

        document.getElementById('monitoringError').innerHTML = '';
        document.getElementById('monitoringContent').innerHTML =
            `<div class="empty-state"><div class="empty-state-icon">📡</div><div>Loading metrics...</div></div>`;

        try {
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
            const data = await resp.json();
            renderHealthMetrics(data);
        } catch (err) {
            document.getElementById('monitoringError').innerHTML =
                `<div class="error">Failed to load metrics: ${err.message}</div>`;
            document.getElementById('monitoringContent').innerHTML = '';
        }
    }

    function renderHealthMetrics(data) {
        const avgConf = ((data.avg_confidence || 0) * 100).toFixed(1);
        document.getElementById('monitoringContent').innerHTML = `
            <div class="metric-section">
                <div class="metric-section-title">Overview — ${data.window}</div>
                <table style="width:100%;border-collapse:collapse;margin-top:12px;">
                    <thead>
                        <tr style="border-bottom:1px solid var(--border);color:var(--text-secondary);text-align:left;">
                            <th style="padding:8px 12px;font-weight:600;font-size:12px;">Metric</th>
                            <th style="padding:8px 12px;font-weight:600;font-size:12px;">Value</th>
                            <th style="padding:8px 12px;font-weight:600;font-size:12px;">Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="border-bottom:1px solid var(--border);">
                            <td style="padding:10px 12px;">Total Evaluations</td>
                            <td style="padding:10px 12px;color:var(--accent);font-weight:700;">${data.total_evaluations}</td>
                            <td style="padding:10px 12px;color:var(--text-secondary);">Conversations evaluated in the selected window</td>
                        </tr>
                        <tr>
                            <td style="padding:10px 12px;">Avg Final Score</td>
                            <td style="padding:10px 12px;color:var(--accent);font-weight:700;">${avgConf}%</td>
                            <td style="padding:10px 12px;color:var(--text-secondary);">Mean final score across all evaluations (higher = better)</td>
                        </tr>
                    </tbody>
                </table>
            </div>`;
    }

    // ── Helpers ──
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ── Init ──
    function initializeDashboard() {
        initializeTheme();
        initializeTab();

        const savedPref = localStorage.getItem('autoRefreshEnabled');
        if (savedPref === 'true') {
            autoRefreshEnabled = true;
            document.getElementById('autoRefreshToggle').checked = true;
            startAutoRefresh();
        }
    }

    initializeDashboard();
</script>
</body>
</html>
