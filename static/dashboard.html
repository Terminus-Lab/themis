<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Themis - Evaluation Dashboard</title>
    <style>
        :root {
            /* Dark theme (default) */
            --bg-primary: #1a1a1a;
            --bg-secondary: #242424;
            --bg-tertiary: #2a2a2a;
            --border-color: #333;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --text-tertiary: #666;
            --text-muted: #aaa;
            --accent-color: #00d4aa;
            --accent-hover: #00e6bb;
            --accent-active: #00c299;
            --input-bg: #1a1a1a;
            --input-border: #444;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #e8e8e8;
            --border-color: #ddd;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --text-tertiary: #999;
            --text-muted: #555;
            --accent-color: #00a886;
            --accent-hover: #00b894;
            --accent-active: #009977;
            --input-bg: #ffffff;
            --input-border: #ccc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 14px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content {
            flex: 1;
        }

        h1 {
            color: var(--accent-color);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .theme-toggle:hover {
            background: var(--bg-tertiary);
        }

        .theme-toggle-label {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filters {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .filter-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background: var(--accent-color);
            color: var(--bg-primary);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            background: var(--accent-active);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            flex: 1;
            min-width: 150px;
            transition: background 0.3s, border-color 0.3s;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: var(--accent-color);
            font-size: 24px;
            font-weight: 600;
        }

        .results-table {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
        }

        th {
            text-align: left;
            padding: 15px;
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        tbody tr {
            border-bottom: 1px solid var(--bg-tertiary);
            cursor: pointer;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: var(--bg-tertiary);
        }

        tbody tr.expanded {
            background: var(--bg-tertiary);
        }

        td {
            padding: 15px;
            color: var(--text-primary);
        }

        .verdict {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .verdict-pass {
            background: #00d4aa33;
            color: #00d4aa;
        }

        .verdict-review {
            background: #ffa50033;
            color: #ffa500;
        }

        .verdict-fail {
            background: #ff4d4d33;
            color: #ff4d4d;
        }

        .confidence {
            color: var(--accent-color);
            font-weight: 600;
        }

        .query-preview {
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-muted);
        }

        .detail-row {
            display: none;
            background: var(--bg-primary);
        }

        .detail-row.visible {
            display: table-row;
        }

        .detail-content {
            padding: 20px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-title {
            color: var(--accent-color);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .detail-text {
            color: var(--text-primary);
            line-height: 1.8;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 6px;
            border-left: 3px solid var(--accent-color);
        }

        .stages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .stage-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
        }

        .stage-name {
            color: var(--text-secondary);
            font-size: 11px;
            margin-bottom: 5px;
        }

        .stage-score {
            color: var(--accent-color);
            font-size: 18px;
            font-weight: 600;
        }

        .stage-reason {
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 5px;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        .pagination-info {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .pagination-controls {
            display: flex;
            gap: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .error {
            background: #ff4d4d33;
            border: 1px solid #ff4d4d;
            border-radius: 8px;
            padding: 15px;
            color: #ff4d4d;
            margin-bottom: 20px;
        }

        .timestamp {
            color: var(--text-tertiary);
            font-size: 12px;
        }

        .refresh-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .refresh-status {
            flex: 1;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .refresh-status.active {
            color: var(--accent-color);
        }

        .refresh-controls button {
            padding: 8px 16px;
        }

        .refresh-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
            margin: 0 10px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border-color);
            transition: 0.3s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: var(--bg-primary);
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: var(--accent-color);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>⚖️ Themis Evaluation Dashboard</h1>
                <div class="subtitle">Real-time AI agent response evaluation results</div>
            </div>
            <div class="theme-toggle" onclick="toggleTheme()">
                <span class="theme-toggle-label" id="themeLabel">Dark Mode</span>
                <span id="themeIcon">🌙</span>
            </div>
        </header>

        <div class="filters">
            <div class="filter-row">
                <div class="filter-group">
                    <label>Agent Name</label>
                    <input type="text" id="agentFilter" placeholder="Filter by agent name...">
                </div>
                <div class="filter-group">
                    <label>Verdict</label>
                    <select id="verdictFilter">
                        <option value="">All verdicts</option>
                        <option value="pass">Pass</option>
                        <option value="review">Review</option>
                        <option value="fail">Fail</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Results per page</label>
                    <select id="limitFilter">
                        <option value="10">10</option>
                        <option value="25" selected>25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
                <div class="filter-group">
                    <button onclick="applyFilters()">Apply Filters</button>
                </div>
                <div class="filter-group">
                    <button class="btn-secondary" onclick="resetFilters()">Reset</button>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Results</div>
                <div class="stat-value" id="totalCount">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Current Page</div>
                <div class="stat-value" id="currentPage">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Showing</div>
                <div class="stat-value" id="showingCount">-</div>
            </div>
        </div>

        <div id="errorContainer"></div>

        <div class="refresh-controls">
            <div class="refresh-status" id="refreshStatus">Auto-refresh: OFF</div>
            <label class="toggle-switch">
                <input type="checkbox" id="autoRefreshToggle" onchange="toggleAutoRefresh()">
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div class="results-table">
            <table>
                <thead>
                    <tr>
                        <th>Event ID</th>
                        <th>Agent</th>
                        <th>Query</th>
                        <th>Verdict</th>
                        <th>Confidence</th>
                        <th>Stages</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <tr>
                        <td colspan="6" class="loading">Loading results...</td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination">
                <div class="pagination-info" id="paginationInfo">-</div>
                <div class="pagination-controls">
                    <button id="prevBtn" onclick="previousPage()" disabled>← Previous</button>
                    <button id="nextBtn" onclick="nextPage()" disabled>Next →</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentOffset = 0;
        let currentLimit = 25;
        let totalResults = 0;
        let hasMore = false;
        let expandedRows = new Set(); // Now stores event_ids instead of row_ids
        let autoRefreshEnabled = false;
        let refreshInterval = null;

        async function fetchResults() {
            const agentName = document.getElementById('agentFilter').value;
            const verdict = document.getElementById('verdictFilter').value;
            const limit = parseInt(document.getElementById('limitFilter').value);

            let url = `${API_BASE}/api/v1/results?limit=${limit}&offset=${currentOffset}`;
            if (agentName) url += `&agent_name=${encodeURIComponent(agentName)}`;
            if (verdict) url += `&verdict=${encodeURIComponent(verdict)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                renderResults(data);
                updateStats(data);
                updatePagination(data);
                clearError();
            } catch (error) {
                showError(`Failed to fetch results: ${error.message}`);
                renderEmpty();
            }
        }

        function renderResults(data) {
            const tbody = document.getElementById('resultsBody');

            if (!data.results || data.results.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <div class="empty-state-icon">📊</div>
                            <div>No evaluation results found</div>
                            <div style="margin-top: 10px; font-size: 12px;">Try adjusting your filters or run some evaluations</div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = '';
            data.results.forEach((result, index) => {
                const rowId = `row-${result.event_id}`;
                const detailId = `detail-${result.event_id}`;

                // Main row
                const row = document.createElement('tr');
                row.id = rowId;
                row.onclick = () => toggleDetails(result.event_id);
                row.innerHTML = `
                    <td><code>${result.event_id}</code></td>
                    <td>${result.agent_name} <span class="timestamp">v${result.agent_version}</span></td>
                    <td class="query-preview">${result.user_query}</td>
                    <td><span class="verdict verdict-${result.verdict}">${result.verdict}</span></td>
                    <td class="confidence">${(result.confidence * 100).toFixed(1)}%</td>
                    <td>${result.stage_scores.length} stages</td>
                `;
                tbody.appendChild(row);

                // Detail row (initially hidden)
                const detailRow = document.createElement('tr');
                detailRow.id = detailId;
                detailRow.className = 'detail-row';
                detailRow.innerHTML = `
                    <td colspan="6">
                        <div class="detail-content">
                            <div class="detail-section">
                                <div class="detail-title">User Query</div>
                                <div class="detail-text">${result.user_query}</div>
                            </div>
                            <div class="detail-section">
                                <div class="detail-title">Agent Answer</div>
                                <div class="detail-text">${result.answer}</div>
                            </div>
                            ${result.context ? `
                            <div class="detail-section">
                                <div class="detail-title">Context</div>
                                <div class="detail-text">${result.context}</div>
                            </div>
                            ` : ''}
                            <div class="detail-section">
                                <div class="detail-title">Stage Scores</div>
                                <div class="stages-grid">
                                    ${result.stage_scores.map(stage => `
                                        <div class="stage-card">
                                            <div class="stage-name">${stage.name}</div>
                                            <div class="stage-score">${(stage.score * 100).toFixed(0)}%</div>
                                            ${stage.reason ? `<div class="stage-reason">${stage.reason}</div>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(detailRow);

                // Re-expand if this row was previously expanded
                if (expandedRows.has(result.event_id)) {
                    row.classList.add('expanded');
                    detailRow.classList.add('visible');
                }
            });
        }

        function toggleDetails(eventId) {
            const row = document.getElementById(`row-${eventId}`);
            const detailRow = document.getElementById(`detail-${eventId}`);

            if (!row || !detailRow) return;

            if (expandedRows.has(eventId)) {
                expandedRows.delete(eventId);
                row.classList.remove('expanded');
                detailRow.classList.remove('visible');
            } else {
                expandedRows.add(eventId);
                row.classList.add('expanded');
                detailRow.classList.add('visible');
            }
        }

        function updateStats(data) {
            document.getElementById('totalCount').textContent = data.total || 0;
            document.getElementById('currentPage').textContent = Math.floor(currentOffset / currentLimit) + 1;
            document.getElementById('showingCount').textContent = data.count || 0;

            totalResults = data.total;
            hasMore = data.has_more;
        }

        function updatePagination(data) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const info = document.getElementById('paginationInfo');

            prevBtn.disabled = currentOffset === 0;
            nextBtn.disabled = !data.has_more;

            const start = currentOffset + 1;
            const end = currentOffset + (data.count || 0);
            info.textContent = `Showing ${start}-${end} of ${data.total || 0} results`;
        }

        function applyFilters() {
            currentOffset = 0;
            currentLimit = parseInt(document.getElementById('limitFilter').value);
            expandedRows.clear();
            fetchResults();
        }

        function resetFilters() {
            document.getElementById('agentFilter').value = '';
            document.getElementById('verdictFilter').value = '';
            document.getElementById('limitFilter').value = '25';
            applyFilters();
        }

        function nextPage() {
            if (hasMore) {
                currentOffset += currentLimit;
                expandedRows.clear();
                fetchResults();
            }
        }

        function previousPage() {
            if (currentOffset > 0) {
                currentOffset = Math.max(0, currentOffset - currentLimit);
                expandedRows.clear();
                fetchResults();
            }
        }

        function showError(message) {
            const container = document.getElementById('errorContainer');
            container.innerHTML = `<div class="error">⚠️ ${message}</div>`;
        }

        function clearError() {
            document.getElementById('errorContainer').innerHTML = '';
        }

        function renderEmpty() {
            document.getElementById('totalCount').textContent = '0';
            document.getElementById('currentPage').textContent = '0';
            document.getElementById('showingCount').textContent = '0';
        }

        function toggleAutoRefresh() {
            autoRefreshEnabled = document.getElementById('autoRefreshToggle').checked;

            // Save preference to localStorage
            localStorage.setItem('autoRefreshEnabled', autoRefreshEnabled);

            if (autoRefreshEnabled) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            autoRefreshEnabled = true;
            updateRefreshStatus();

            // Start refresh interval (every 10 seconds)
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                fetchResults();
            }, 10000);
        }

        function stopAutoRefresh() {
            autoRefreshEnabled = false;

            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }

            updateRefreshStatus();
        }

        function updateRefreshStatus() {
            const statusEl = document.getElementById('refreshStatus');

            if (autoRefreshEnabled) {
                statusEl.textContent = '🔄 Auto-refresh: ON';
                statusEl.classList.add('active');
            } else {
                statusEl.textContent = '⏸️ Auto-refresh: OFF';
                statusEl.classList.remove('active');
            }
        }

        // Theme Management
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const themeLabel = document.getElementById('themeLabel');
            const themeIcon = document.getElementById('themeIcon');

            if (theme === 'light') {
                themeLabel.textContent = 'Light Mode';
                themeIcon.textContent = '☀️';
            } else {
                themeLabel.textContent = 'Dark Mode';
                themeIcon.textContent = '🌙';
            }
        }

        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeUI(savedTheme);
        }

        // Initial setup
        function initializeDashboard() {
            // Initialize theme first
            initializeTheme();

            // Restore auto-refresh preference from localStorage
            const savedPreference = localStorage.getItem('autoRefreshEnabled');
            if (savedPreference !== null) {
                autoRefreshEnabled = savedPreference === 'true';
                document.getElementById('autoRefreshToggle').checked = autoRefreshEnabled;

                if (autoRefreshEnabled) {
                    startAutoRefresh();
                }
            }

            updateRefreshStatus();
            fetchResults();
        }

        initializeDashboard();
    </script>
</body>
</html>
