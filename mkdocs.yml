site_name: Themis Documentation
site_url: https://terminus-lab.github.io/themis
site_description: AI response evaluation service with MCP and API interfaces
site_author: Terminus Lab
repo_url: https://github.com/Terminus-Lab/themis
repo_name: Terminus-Lab/themis
edit_uri: edit/main/docs/

# Theme configuration
theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow

  icon:
    repo: fontawesome/brands/github

# Navigation structure
nav:
  - Home: index.md

  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Configuration: getting-started/configuration.md

  - Deployment:
    - API Mode: deployment/api-mode.md

  - Testing:
    - API Tests: testing/api-tests.md
    - Batch Tests: testing/batch-tests.md
    - MCP Tests: testing/mcp-tests.md
    - Streaming Tests: testing/streaming-tests.md

  - Contributing:
    - Guidelines: contributing.md
    - Code of Conduct: code-of-conduct.md
    - Security Policy: security.md

# Markdown extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Terminus-Lab/themis
      name: GitHub Repository

# Extra CSS
extra_css:
  - stylesheets/extra.css

# Copyright
copyright: Copyright &copy; 2024 Terminus Lab
